spring.datasource.url=jdbc:postgresql://localhost:5432/yt-comments-test
spring.flyway.clean-disabled=false
spring.flyway.validate-migration-naming=true
spring.jpa.hibernate.ddl-auto=validate
spring.test.database.replace=none
winston.api.authors.default-page-size=10
winston.api.videos.default-page-size=10
winston.controller.default-slo-ms=100
winston.repository.default-slo-ms=5
winston.youtube.api-key=YOUTUBE_API_KEY
winston.youtube.daily-request-quota=10000
winston.youtube.mock-root-url=${wiremock.server.baseUrl}
