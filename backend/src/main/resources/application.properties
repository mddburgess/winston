management.endpoints.web.exposure.include=health,info
spring.application.name=winston
spring.flyway.clean-disabled=true
spring.jackson.default-property-inclusion=non_null
spring.jpa.hibernate.ddl-auto=validate
spring.main.banner-mode=off
winston.api.videos.default-page-size=10
winston.controller.default-slo-ms=100
winston.repository.default-slo-ms=5
winston.youtube.api-key=${YOUTUBE_API_KEY}
winston.youtube.daily-request-quota=10000
