summary: Quote pull
description: Estimates the YouTube API quota cost for a pull data request.
tags:
  - Pull
operationId: quotePull
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - operations
        properties:
          operations:
            $ref: ../../schemas/pull/PullOperations.yaml
responses:
  "200":
    description: The operations specified in the request, along with an estimated quota cost for each operation.
    content:
      application/json:
        schema:
          $ref: ../../schemas/pull/QuotePullResponse.yaml
