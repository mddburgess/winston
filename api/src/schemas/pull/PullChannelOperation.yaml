title: Pull Channel Operation
type: object
required:
  - pull
  - channel_handle
properties:
  id:
    type: string
    readOnly: true
  pull:
    type: string
    const: channel
  channel_handle:
    type: string
  status:
    type: string
    readOnly: true
    enum:
      - ready
      - fetching
      - successful
      - warning
      - failed
