title: Pull Request
type: object
required:
  - event_subscription_id
  - operations
properties:
  event_subscription_id:
    type: string
    format: uuid
  operations:
    $ref: ./PullOperations.yaml
  status:
    type: string
    readOnly: true
    enum:
      - accepted
      - fetching
      - paused
      - completed
  id:
    type: string
    readOnly: true
