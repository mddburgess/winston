title: Pull Videos Operation
type: object
required:
  - pull
  - channel_handle
  - status
  - id
properties:
  pull:
    type: string
    const: videos
  channel_handle:
    type: string
  range:
    type: string
    enum:
      - all
      - latest
  status:
    type: string
    readOnly: true
    enum:
      - ready
      - fetching
      - successful
      - warning
      - failed
  id:
    type: string
    readOnly: true
