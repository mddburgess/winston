title: Pull Operation
type: object
required:
  - pull
  - status
properties:
  pull:
    type: string
  id:
    type: string
    readOnly: true
  estimated_cost:
    type: integer
    readOnly: true
    format: int32
  status:
    type: string
    readOnly: true
    enum:
      - ready
      - fetching
      - successful
      - warning
      - failed
discriminator:
  propertyName: pull
  mapping:
    channel: ./PullChannelOperation.yaml
    videos: ./PullVideosOperation.yaml
    comments: ./PullCommentsOperation.yaml
    replies: ./PullRepliesOperation.yaml
