$schema: https://json-schema.org/draft/2020-12/schema
title: List Videos Response
description: The response for the list videos for channel endpoint.
type: object
required:
  - channel_handle
  - results
  - videos
properties:
  channel_handle:
    description: The unique channel handle used in the channel's URL.
    type: string
  results:
    type: object
    required:
      - page_count
      - total_count
    properties:
      page_count:
        type: integer
        format: int32
        minimum: 0
      total_count:
        type: integer
        format: int32
        minimum: 0
  videos:
    description: A list of all the videos for the channel.
    type: array
    items:
      $ref: ./Video.yaml
