$schema: https://json-schema.org/draft/2020-12/schema
title: List Authors Response
description: The response for the list authors endpoint.
type: object
required:
  - results
  - authors
properties:
  results:
    type: object
    required:
      - page_count
      - total_count
    properties:
      page_count:
        type: integer
        format: int32
        minimum: 0
      total_count:
        type: integer
        format: int32
        minimum: 0
  authors:
    description: A list of all the authors.
    type: array
    items:
      $ref: ./Author.yaml
