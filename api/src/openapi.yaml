openapi: 3.1.1

info:
  title: Winston
  description: OpenAPI specification for the Winston backend.
  contact:
    name: Mike Burgess
  license:
    name: MIT Non-AI License
    url: https://github.com/mddburgess/winston/blob/main/LICENSE.md
  version: v1

servers:
  - description: Local server used for development.
    url: http://localhost:8080

paths:
  /api/v1/channels:
    get:
      summary: List channels
      description: Lists the channel data for all the fetched channels.
      tags:
        - Channels
      operationId: listChannels
      parameters:
        - name: includeArchived
          description: Flag indicating if archived channels should also be returned in the response. Default is false.
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: ./schemas/channels/ListChannelsResponse.yaml
              examples:
                Channel list:
                  $ref: ./examples/listChannels/200-channelList.yaml
                Empty channel list:
                  $ref: ./examples/listChannels/200-emptyChannelList.yaml

  /api/v1/channels/{handle}:
    get:
      summary: Get channel
      description: Gets the channel data for a single fetched channel.
      tags:
        - Channels
      operationId: getChannel
      parameters:
        - $ref: ./parameters/channelHandle.yaml
      responses:
        "200":
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: ./schemas/channels/Channel.yaml
              examples:
                Channel:
                  $ref: ./examples/getChannel/200-channel.yaml
        "404":
          $ref: "./responses/index.yaml#/404-channelNotFound"

  /api/v1/channels/{handle}/properties:
    patch:
      summary: Patch channel properties
      description: Patches the non-YouTube properties for a single channel.
      tags:
        - Channels
      operationId: patchChannelProperties
      parameters:
        - $ref: ./parameters/channelHandle.yaml
      requestBody:
        description: List of patch operations to apply to the channel properties.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ./schemas/PatchOperation.yaml
            examples:
              Mark channel as archived:
                $ref: ./examples/patchChannelProperties/markArchived.yaml
              Mark channel as not archived:
                $ref: ./examples/patchChannelProperties/markNotArchived.yaml
      responses:
        "200":
          description: The patch was successful.
          content:
            application/json:
              schema:
                $ref: ./schemas/channels/ChannelProperties.yaml
              examples:
                Channel is archived:
                  $ref: ./examples/patchChannelProperties/200-channelArchived.yaml
                Channel is not archived:
                  $ref: ./examples/patchChannelProperties/200-channelNotArchived.yaml

  /api/v1/channels/{handle}/videos:
    get:
      summary: List videos
      description: Lists the video data for all the fetched videos for a single channel.
      tags:
        - Videos
      operationId: listVideos
      parameters:
        - $ref: ./parameters/channelHandle.yaml
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: ./schemas/videos/ListVideosResponse.yaml
              examples:
                Video list:
                  $ref: ./examples/listVideos/200-videoList.yaml
                Empty video list:
                  $ref: ./examples/listVideos/200-emptyVideoList.yaml
        "404":
          $ref: "./responses/index.yaml#/404-channelNotFound"

  /api/v1/videos/{id}:
    get:
      summary: Get video
      description: Gets the video data for a single fetched video.
      tags:
        - Videos
      operationId: getVideo
      parameters:
        - $ref: ./parameters/videoId.yaml
      responses:
        "200":
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: ./schemas/videos/Video.yaml
              examples:
                Video:
                  $ref: ./examples/getVideo/200-video.yaml
        "404":
          $ref: "./responses/index.yaml#/404-videoNotFound"

  /api/v1/videos/{id}/comments:
    get:
      summary: List comments
      description: Lists all the fetched comments for a single video.
      tags:
        - Comments
      operationId: listComments
      parameters:
        - $ref: ./parameters/videoId.yaml
        - name: author
          description:
            The unique channel handle used in the author's channel URL.
            Set this parameter to filter the response so that only comments published by this author are returned.
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: ./schemas/comments/ListCommentsResponse.yaml
        "404":
          $ref: "./responses/index.yaml#/404-videoNotFound"

  /api/v1/comments/{id}/properties:
    patch:
      summary: Patch comment properties
      description: Patches the non-YouTube properties for a single comment.
      tags:
        - Comments
      operationId: patchCommentProperties
      parameters:
        - $ref: ./parameters/commentId.yaml
      requestBody:
        description: List of patch operations to apply to the comment properties.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ./schemas/PatchOperation.yaml
      responses:
        "200":
          description: The patch was successful.
          content:
            application/json:
              schema:
                $ref: ./schemas/comments/CommentProperties.yaml

  /api/v1/authors:
    get:
      summary: List authors
      description: Lists the authors for all the fetched comments.
      tags:
        - Authors
      operationId: listAuthors
      parameters:
        - name: search
          in: query
          schema:
            type: string
            minLength: 1
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: ./schemas/authors/ListAuthorsResponse.yaml

  /api/v1/authors/{handle}:
    get:
      summary: Get author
      description: Gets the author summary data for a single author.
      tags:
        - Authors
      operationId: getAuthor
      parameters:
        - $ref: ./parameters/authorHandle.yaml
      responses:
        "200":
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: ./schemas/authors/GetAuthorResponse.yaml
        "404":
          $ref: "./responses/index.yaml#/404-authorNotFound"
    patch:
      summary: Patch author
      description: Patches the data for a single author.
      tags:
        - Authors
      operationId: patchAuthor
      parameters:
        - $ref: ./parameters/authorHandle.yaml
      requestBody:
        description: List of patch operations to apply to the author.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ./schemas/PatchOperation.yaml
      responses:
        "200":
          description: The patch was successful.
          content:
            application/json:
              schema:
                $ref: ./schemas/authors/GetAuthorResponse.yaml
        "404":
          $ref: "./responses/index.yaml#/404-authorNotFound"

  /api/v1/authors/{handle}/channels:
    get:
      summary: Get channel summary for author
      description: Gets the channel summary for a single author.
      tags:
        - Authors
      operationId: getAuthorChannelSummary
      parameters:
        - $ref: ./parameters/authorHandle.yaml
      responses:
        "200":
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: ./schemas/authors/AuthorChannelSummary.yaml
        "404":
          $ref: "./responses/index.yaml#/404-authorNotFound"

  /api/v1/authors/{handle}/videos:
    get:
      summary: Get video summary for author
      description: Gets the video summary for a single author and channel.
      tags:
        - Authors
      operationId: getAuthorVideoSummary
      parameters:
        - $ref: ./parameters/authorHandle.yaml
      responses:
        "200":
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: ./schemas/authors/AuthorVideoSummary.yaml
        "404":
          $ref: "./responses/index.yaml#/404-authorNotFound"

  /api/v1/channels/{id}/thumbnail:
    get:
      summary: Get channel thumbnail
      description: Gets the thumbnail image for a channel.
      tags:
        - Thumbnails
      operationId: getChannelThumbnail
      parameters:
        - $ref: ./parameters/channelId.yaml
      responses:
        "200":
          $ref: "./responses/index.yaml#/200-thumbnail"
        "404":
          $ref: "./responses/index.yaml#/404-channelNotFound"

  /api/v1/videos/{id}/thumbnail:
    get:
      summary: Get video thumbnail
      description: Gets the thumbnail image for a video.
      tags:
        - Thumbnails
      operationId: getVideoThumbnail
      parameters:
        - $ref: ./parameters/videoId.yaml
      responses:
        "200":
          $ref: "./responses/index.yaml#/200-thumbnail"
        "404":
          $ref: "./responses/index.yaml#/404-videoNotFound"

  /api/v1/authors/{id}/thumbnail:
    get:
      summary: Get author thumbnail
      description: Gets the thumbnail image for an author.
      tags:
        - Thumbnails
      operationId: getAuthorThumbnail
      parameters:
        - $ref: ./parameters/authorId.yaml
      responses:
        "200":
          $ref: "./responses/index.yaml#/200-thumbnail"
        "404":
          $ref: "./responses/index.yaml#/404-videoNotFound"

  /api/v1/fetch/limits:
    get:
      summary: Get fetch limits
      description: Gets the limits on calling the fetch API.
      tags:
        - Fetch
      operationId: getFetchLimits
      responses:
        "200":
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: ./schemas/fetch/FetchLimitsResponse.yaml

  /api/v1/notifications:
    get:
      summary: Get notifications
      description: Opens an event subscription to receive fetch events.
      tags:
        - Notifications
      operationId: subscribe
      responses:
        "200":
          description: The request was successful.
          content:
            text/event-stream:
              schema:
                type: array
                format: event-stream
                items:
                  type: string

  /api/v1/pull:
    post:
      summary: Pull data
      description: Submits a request to pull data from YouTube.
      tags:
        - Pull
      operationId: pull
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - event_subscription_id
                - operations
              properties:
                event_subscription_id:
                  type: string
                  format: uuid
                operations:
                  $ref: "#/components/schemas/PullOperations"
                status:
                  type: string
                  readOnly: true
                  enum:
                    - accepted
                    - fetching
                    - paused
                    - completed
                id:
                  type: string
                  readOnly: true
            examples:
              Pull channel:
                $ref: ./examples/pull/pullChannel.yaml
              Pull channel and videos:
                $ref: ./examples/pull/pullChannelAndVideos.yaml
              Pull latest videos:
                $ref: ./examples/pull/pullLatestVideos.yaml
              Pull comments:
                $ref: ./examples/pull/pullComments.yaml
              Pull comments and replies:
                $ref: ./examples/pull/pullCommentsAndReplies.yaml
              Pull replies for comment:
                $ref: ./examples/pull/pullRepliesForComment.yaml
              Pull replies for video:
                $ref: ./examples/pull/pullRepliesForVideo.yaml
      responses:
        "202":
          description: The request was accepted for processing.
  #        "422":
  #          description: The request cannot be processed.
  #          content:
  #            application/problem+json:
  #              schema:
  #                $ref: "#/components/schemas/Problem"
  #              examples:
  #                Channel not pulled:
  #                  $ref: ./examples/pull/422-channelNotPulled.yaml
  #                Video not pulled:
  #                  $ref: ./examples/pull/422-videoNotPulled.yaml
  #                Comment not pulled:
  #                  $ref: ./examples/pull/422-commentNotPulled.yaml

  /api/v1/pull/quote:
    post:
      summary: Quote pull
      description: Estimates the YouTube API quota cost for a pull data request.
      tags:
        - Pull
      operationId: quotePull
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - operations
              properties:
                operations:
                  $ref: "#/components/schemas/PullOperations"
      responses:
        "200":
          description: The operations specified in the request, along with an estimated quota cost for each operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotePullResponse"

  /api/v1/settings:
    get:
      summary: Get settings
      tags:
        - Settings
      operationId: getSettings
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema:
                $ref: ./schemas/settings/Settings.yaml
    patch:
      summary: Patch settings
      tags:
        - Settings
      operationId: patchSettings
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ./schemas/PatchOperation.yaml
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema:
                $ref: ./schemas/settings/Settings.yaml

components:
  schemas:
    PullOperations:
      type: array
      items:
        $ref: ./schemas/pull/PullOperation.yaml
    QuotePullResponse:
      type: object
      required:
        - total_estimated_cost
        - operations
      properties:
        total_estimated_cost:
          type: integer
          format: int32
        operations:
          $ref: "#/components/schemas/PullOperations"

tags:
  - name: Channels
    description: Endpoints to get data related to channels.
  - name: Videos
    description: Endpoints to get data related to videos.
  - name: Comments
    description: Endpoints to get data related to comments and replies.
  - name: Authors
    description: Endpoints to get data related to comment authors.
  - name: Thumbnails
    description: Endpoints to get thumbnail images.
  - name: Fetch
    description: Endpoints related to fetching data from YouTube.
  - name: Notifications
    description: Endpoints related to getting fetch events.
  - name: Pull
    description: Endpoints related to pulling data from YouTube.
  - name: Settings
    description: Endpoints to get and set application settings.
